[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysne"
version = "0.1.0"
description = "A Python library for finding all solutions of nonlinear equations using Spiral Dynamics Inspired Optimization (SDOA) with Clustering."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
authors = [
    { name = "Aldy Nugraha Hermawan", email = "aldynugrahahermawan1702@gmail.com" },
    { name = "Azarya Benhanan Isriyanto", email = "azaryaben@gmail.com" }
]
keywords = ["optimization", "nonlinear-equations", "sdoa", "clustering", "numerical-methods", "sobol-sequence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0"
]

[tool.setuptools]
# Ini kuncinya: Hanya anggap folder 'pysne' sebagai paket library
packages = ["pysne", "pysne.clustering", "pysne.initialization", "pysne.optimizers", "pysne.problems"]

[project.urls]
"Homepage" = "https://github.com/p2ms-optimization/pysne"
"Bug Tracker" = "https://github.com/p2ms-optimization/pysne/issues"
